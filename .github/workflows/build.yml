name: Build chopin 6.6

on:
  workflow_dispatch:
    inputs:
      target:
        description: "make target"
        default: "Image dtbs"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc flex bison libssl-dev libelf-dev \
                                      clang lld llvm python3

      - name: Configure
        run: |
          make LLVM=1 gki_defconfig

          scripts/config --disable LTO_CLANG || true
          scripts/config --disable CFI_CLANG || true
          scripts/config --disable SHADOW_CALL_STACK || true
          scripts/config --disable RANDSTRUCT || true
          scripts/config --disable MODULE_SIG_ALL || true
          scripts/config --disable DEBUG_INFO_BTF || true
          scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          scripts/config --set-str SYSTEM_REVOCATION_KEYS ""

          scripts/config --enable ARCH_MEDIATEK
          scripts/config --enable SERIAL_8250
          scripts/config --enable SERIAL_8250_CONSOLE
          scripts/config --enable SERIAL_8250_MT6577
          scripts/config --enable SERIAL_EARLYCON

          make LLVM=1 olddefconfig

          echo "===== key config ====="
          grep -E "ARCH_MEDIATEK|SERIAL_8250_MT6577|SERIAL_EARLYCON|CMDLINE_FORCE" .config

      - name: Build
        run: |
          make LLVM=1 -j$(nproc) ${{ github.event.inputs.target }} 2>&1 | tee build.log

      - name: Check artifacts
        run: |
          ls -lh arch/arm64/boot/Image
          ls -lh arch/arm64/boot/dts/mediatek/mt6891-chopin.dtb
          file arch/arm64/boot/Image

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: chopin-6.6-image
          if-no-files-found: error
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/mediatek/mt6891-chopin.dtb

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
